<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Camera access requires HTTPS. If we somehow loaded over http (not on
      // localhost), bounce up to https before anything else runs.
      if (
        location.protocol === 'http:' &&
        location.hostname !== 'localhost' &&
        location.hostname !== '127.0.0.1'
      ) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      }
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Camera Feed</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="broadcast-page">
    <div class="phone">
      <video id="preview" class="preview" autoplay muted playsinline></video>

      <div class="phone-overlay">
        <div class="top">
          <span id="status" class="status">Ready</span>
          <span class="pill"><span id="viewers">0</span> watching</span>
        </div>
        <div id="sendstats" class="sendstats"></div>

        <div class="bottom">
          <div id="lp-panel" class="lp-panel hidden">
            <div class="lp-steps">
              <span class="lp-steps-label">Step</span>
              <button type="button" class="step" data-step="100">100</button>
              <button type="button" class="step active" data-step="500">500</button>
              <button type="button" class="step" data-step="1000">1000</button>
            </div>
            <div class="lp-row">
              <input class="lp-name" data-p="0" placeholder="Player 1" autocomplete="off" />
              <button type="button" class="lp-btn lp-minus" data-p="0">−</button>
              <span class="lp-val" data-p="0">8000</span>
              <button type="button" class="lp-btn lp-plus" data-p="0">+</button>
            </div>
            <div class="lp-row">
              <input class="lp-name" data-p="1" placeholder="Player 2" autocomplete="off" />
              <button type="button" class="lp-btn lp-minus" data-p="1">−</button>
              <span class="lp-val" data-p="1">8000</span>
              <button type="button" class="lp-btn lp-plus" data-p="1">+</button>
            </div>
            <div class="lp-row chips-row">
              <span class="chips-label">★ Star chips wagered</span>
              <button type="button" class="lp-btn chips-minus">−</button>
              <span class="chips-val" id="chips-val">1</span>
              <button type="button" class="lp-btn chips-plus">+</button>
            </div>
            <div class="lp-foot">
              <label class="lp-start-label"
                >Start
                <input
                  id="lp-start"
                  class="lp-start"
                  type="number"
                  value="8000"
                  inputmode="numeric"
                />
              </label>
              <button type="button" id="lp-reset" class="lp-reset">Reset</button>
            </div>
          </div>

          <input
            id="label"
            class="label-input"
            placeholder="Table name (e.g. Table 3)"
            autocomplete="off"
          />
          <div class="btn-row">
            <button id="start" class="btn primary">Go live</button>
            <button id="switch" class="btn">Flip camera</button>
            <button id="lp-toggle" class="btn">⚔ Duel</button>
          </div>
          <p class="hint" id="hint">Tap “Go live”, then allow camera access when asked.</p>
        </div>
      </div>
    </div>

    <script src="/broadcast.js"></script>
  </body>
</html>
